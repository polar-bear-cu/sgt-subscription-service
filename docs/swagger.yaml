definitions:
  dtos.HealthResponse:
    properties:
      serviceName:
        type: string
      status:
        type: string
      timestamp:
        type: string
    type: object
  dtos.SubscriptionRequest:
    properties:
      category:
        enum:
        - streaming
        - music
        - productivity
        - technology
        type: string
      cost:
        minimum: 0
        type: number
      ftEndDate:
        type: string
      name:
        maxLength: 50
        type: string
      nextBillingDate:
        type: string
      reminderTimeInAdvanced:
        minimum: 1
        type: integer
      status:
        enum:
        - active
        - free_trial
        - inactive
        type: string
      type:
        enum:
        - monthly
        - yearly
        type: string
    required:
    - category
    - name
    - nextBillingDate
    - reminderTimeInAdvanced
    - type
    type: object
  dtos.SubscriptionResponse:
    properties:
      category:
        type: string
      cost:
        type: number
      createdAt:
        type: string
      ftEndDate:
        type: string
      id:
        type: string
      name:
        type: string
      nextBillingDate:
        type: string
      reminderTimeInAdvanced:
        type: integer
      status:
        type: string
      type:
        type: string
      updatedAt:
        type: string
    type: object
  dtos.UpdateStatusRequest:
    properties:
      status:
        enum:
        - active
        - free_trial
        - inactive
        type: string
    required:
    - status
    type: object
info:
  contact: {}
  description: REST API for the Subglutee subscription service
  title: Subscription Service API
  version: "1.0"
paths:
  /api/v1/subscriptions:
    post:
      consumes:
      - application/json
      parameters:
      - description: subscription
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.SubscriptionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/dtos.SubscriptionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: create a subscription
      tags:
      - subscriptions
  /api/v1/subscriptions/{id}:
    delete:
      parameters:
      - description: subscription id
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: delete a subscription
      tags:
      - subscriptions
    get:
      parameters:
      - description: subscription id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SubscriptionResponse'
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: get a subscription
      tags:
      - subscriptions
    patch:
      consumes:
      - application/json
      parameters:
      - description: subscription id
        in: path
        name: id
        required: true
        type: string
      - description: new status
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.UpdateStatusRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SubscriptionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: change subscription status
      tags:
      - subscriptions
    put:
      consumes:
      - application/json
      parameters:
      - description: subscription id
        in: path
        name: id
        required: true
        type: string
      - description: subscription
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/dtos.SubscriptionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.SubscriptionResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "401":
          description: Unauthorized
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: update a subscription (all fields)
      tags:
      - subscriptions
  /health:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/dtos.HealthResponse'
      summary: health check
      tags:
      - ops
swagger: "2.0"
